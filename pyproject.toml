[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seqfidelity"
version = "0.1.0"
description = "Sequence models and tools for paired effect prediction and compression analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
dependencies = ["torch>=2.2", "numpy>=1.24", "pandas>=2", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=8"]
io = ["pyarrow>=12"]

[project.scripts]
seqfidelity = "seqfidelity.cli:main"

[tool.setuptools.packages.find]
include = ["seqfidelity", "seqfidelity.*"]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
